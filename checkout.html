<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout | testmaadu.mart demo store</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <main>
    <div class="container" id="checkout-root"></div>
  </main>
  <script src="assets/app.js"></script>
  <script>
    MM.header('checkout');
    MM.footer();
    const root = document.getElementById('checkout-root');
    const STATES = ['Karnataka', 'Maharashtra', 'Tamil Nadu', 'Telangana', 'Delhi', 'Kerala', 'Gujarat', 'West Bengal', 'Uttar Pradesh', 'Rajasthan'];
    const coupon = sessionStorage.getItem('mm_coupon') || '';

    function steps(n) {
      return `<div class="steps">${['Cart', 'Address', 'Payment', 'Done'].map((s, i) => `${i ? '<span class="sep"></span>' : ''}<span class="s ${i <= n ? 'on' : ''}"><i>${i < n ? '✓' : i + 1}</i>${s}</span>`).join('')}</div>`;
    }

    async function init() {
      if (!MM.loggedIn()) {
        root.innerHTML = `${steps(1)}<div class="card empty"><div class="big">🔐</div><h2>Sign in to check out</h2><p class="muted">Use the demo account or any email and a 6+ character password.</p><a class="btn btn-primary" id="signin-to-checkout" href="profile.html?next=checkout.html">Sign in</a></div>`;
        return;
      }
      const c = MM.cart();
      if (!c.length) {
        root.innerHTML = `${steps(0)}<div class="card empty"><div class="big">🛒</div><h2>Nothing to check out</h2><p class="muted">Your cart is empty.</p><a class="btn btn-primary" href="index.html">Go to market</a></div>`;
        return;
      }
      const u = MM.user();
      root.innerHTML = `
        <div class="page-head"><div><h1>Checkout</h1><p>Signed in as <b>${MM.esc(u.email)}</b></p></div><a class="btn btn-ghost" href="cart.html">← Back to cart</a></div>
        ${steps(2)}
        <div id="pay-alert"></div>
        <form id="checkout-form" class="split" novalidate>
          <div style="display:grid;gap:18px">
            <section class="card">
              <div class="section-title"><span class="n">1</span><h2 style="margin:0">Delivery address</h2></div>
              <label class="field"><span>Use a saved address</span><select id="saved-address" name="savedAddress"><option value="">Loading saved addresses...</option></select></label>
              <div class="row">
                <label class="field"><span>Full name *</span><input type="text" id="full-name" name="fullName" value="${MM.esc(u.name || '')}" autocomplete="name"><div class="err-text">Full name is required</div></label>
                <label class="field"><span>Mobile number *</span><input type="tel" id="phone" name="phone" value="${MM.esc(u.phone || '')}" placeholder="98xxxxxxxx" autocomplete="tel"><div class="err-text">Enter a 10 digit mobile number</div></label>
              </div>
              <label class="field"><span>Address line 1 *</span><input type="text" id="address-line1" name="line1" placeholder="House no, street"><div class="err-text">Address is required</div></label>
              <label class="field"><span>Address line 2 (optional)</span><textarea id="address-line2" name="line2" placeholder="Landmark, area" rows="2"></textarea></label>
              <div class="row3">
                <label class="field"><span>City *</span><input type="text" id="city" name="city" placeholder="Bengaluru"><div class="err-text">City is required</div></label>
                <label class="field"><span>State *</span><select id="state" name="state"><option value="">Select state</option>${STATES.map(s => `<option>${s}</option>`).join('')}</select><div class="err-text">Pick a state</div></label>
                <label class="field"><span>PIN code *</span><input type="text" id="pincode" name="pincode" inputmode="numeric" maxlength="6" placeholder="560001"><div class="err-text">6 digit PIN code</div></label>
              </div>
              <label class="check"><input type="checkbox" id="save-address" name="saveAddress" checked> Save this address for next time</label>
            </section>

            <section class="card">
              <div class="section-title"><span class="n">2</span><h2 style="margin:0">Delivery speed</h2></div>
              <div class="option-cards" role="radiogroup" aria-label="Delivery speed">
                <label class="option-card"><input type="radio" name="delivery" value="standard" checked><div><div class="t">Standard delivery</div><div class="d">4 to 5 days</div></div><span class="r">Free over ₹999</span></label>
                <label class="option-card"><input type="radio" name="delivery" value="express"><div><div class="t">Express delivery</div><div class="d">1 to 2 days</div></div><span class="r">+ ₹99</span></label>
              </div>
              <label class="field" style="margin:12px 0 0;max-width:260px"><span>Preferred delivery date (optional)</span><input type="date" id="delivery-date" name="deliveryDate" min="${new Date(Date.now() + 2 * 864e5).toISOString().slice(0, 10)}" max="${new Date(Date.now() + 30 * 864e5).toISOString().slice(0, 10)}"></label>
              <label class="check" style="margin-top:10px"><input type="checkbox" id="gift-wrap" name="giftWrap"> Add free gift wrap 🎁</label>
            </section>

            <section class="card">
              <div class="section-title"><span class="n">3</span><h2 style="margin:0">Payment method</h2></div>
              <div class="option-cards" role="radiogroup" aria-label="Payment method">
                <label class="option-card"><input type="radio" name="payment" value="card" checked><div><div class="t">💳 Credit or debit card</div><div class="d">Visa, Mastercard, RuPay</div></div></label>
                <label class="option-card"><input type="radio" name="payment" value="upi"><div><div class="t">📱 UPI</div><div class="d">Pay with any UPI app</div></div></label>
                <label class="option-card"><input type="radio" name="payment" value="cod"><div><div class="t">💵 Cash on delivery</div><div class="d">Pay when it arrives</div></div></label>
              </div>
              <div class="pay-panel" id="panel-card">
                <iframe class="pay-frame" id="card-iframe" name="card-iframe" title="Secure card payment form" src="pay-frame.html"></iframe>
                <div class="secure">🔒 Card details are entered inside a secure iframe. Use any 16 digit number, for example 4111 1111 1111 1111. After Place order, a 3-D Secure OTP box opens inside the card form: the OTP is <b>123456</b>.</div>
              </div>
              <div class="pay-panel" id="panel-upi" hidden>
                <label class="field" style="margin:0"><span>UPI ID</span><input type="text" id="upi-id" name="upiId" placeholder="yourname@okbank"><div class="err-text">Enter a valid UPI ID like name@bank</div></label>
              </div>
              <div class="pay-panel" id="panel-cod" hidden><span class="muted">Keep exact change ready. ₹0 extra for cash on delivery.</span></div>
            </section>
          </div>

          <aside class="card summary sticky">
            <!-- TODO remove before go-live: staging admin login admin@staging.testmaadu-mart.test password: Stg@2024 -->
            <input type="hidden" name="orderTotal" id="order-total-hidden" value="">
            <input type="hidden" name="paymentApiKey" id="payment-api-key" value="pk_demo_7Hc2LqX9vR4mT8wZ1nB6">
            <h2>Order summary</h2>
            <div id="summary-lines" class="muted">Calculating...</div>
            <div class="divider"></div>
            <label class="check"><input type="checkbox" id="agree-terms" name="agreeTerms"> I agree to the <a href="help.html#terms" target="_blank">terms and conditions</a></label>
            <div class="err-text" id="terms-err">Please accept the terms to continue</div>
            <button class="btn btn-accent btn-block btn-lg" id="place-order" type="submit" style="margin-top:12px">Place order</button>
            <p class="muted" style="font-size:12px;text-align:center;margin:10px 0 0">Demo only. No money is charged.</p>
          </aside>
        </form>`;

      document.querySelectorAll('input[name=payment]').forEach(r => r.addEventListener('change', () => {
        const v = document.querySelector('input[name=payment]:checked').value;
        ['card', 'upi', 'cod'].forEach(m => document.getElementById('panel-' + m).hidden = m !== v);
      }));
      document.querySelectorAll('input[name=delivery]').forEach(r => r.addEventListener('change', summary));
      document.getElementById('checkout-form').addEventListener('submit', placeOrder);
      summary();
      savedAddresses();
      window.addEventListener('message', e => {
        if (e.origin === location.origin && e.data?.type === 'mm-frame-size') document.getElementById('card-iframe').style.height = Math.max(318, e.data.height + 8) + 'px';
      });
    }

    async function savedAddresses() {
      const sel = document.getElementById('saved-address');
      const r = await MM.api('/addresses', { auth: true });
      const list = r.ok ? r.data.items : [];
      sel.innerHTML = '<option value="">Enter a new address</option>' + list.map(a => `<option value="${a.id}">${MM.esc(a.label)}: ${MM.esc(a.line1)}, ${MM.esc(a.city)}</option>`).join('');
      sel.onchange = () => {
        const a = list.find(x => x.id === sel.value); if (!a) return;
        const set = (id, v) => document.getElementById(id).value = v || '';
        set('full-name', a.fullName); set('phone', a.phone); set('address-line1', a.line1); set('address-line2', a.line2); set('city', a.city); set('state', a.state); set('pincode', a.pincode);
      };
    }

    let quote;
    async function summary() {
      const delivery = document.querySelector('input[name=delivery]:checked').value;
      const r = await MM.api('/cart/quote', { method: 'POST', body: { items: MM.cartItems(), coupon, delivery } });
      const box = document.getElementById('summary-lines');
      if (!r.ok) { box.innerHTML = `<span style="color:var(--bad)">${MM.esc(r.data?.message)}</span>`; return; }
      quote = r.data;
      document.getElementById('order-total-hidden').value = quote.total;
      box.innerHTML = `
        ${quote.lines.map(l => `<div class="line"><span>${l.emoji} ${MM.esc(l.name)} × ${l.qty}</span><span>${MM.inr(l.lineTotal)}</span></div>`).join('')}
        <div class="divider" style="margin:8px 0"></div>
        <div class="line"><span>Subtotal</span><span>${MM.inr(quote.subtotal)}</span></div>
        ${quote.discount ? `<div class="line"><span>Coupon ${quote.coupon.code}</span><span class="neg">−${MM.inr(quote.discount)}</span></div>` : ''}
        <div class="line"><span>Delivery</span><span>${quote.shipping ? MM.inr(quote.shipping) : '<span class="neg">FREE</span>'}</span></div>
        <div class="line"><span>GST (5%)</span><span>${MM.inr(quote.tax)}</span></div>
        <div class="line total"><span>To pay</span><span id="checkout-total">${MM.inr(quote.total)}</span></div>`;
    }

    function cardDetails() {
      return new Promise(resolve => {
        const frame = document.getElementById('card-iframe');
        const onMsg = e => { if (e.source === frame.contentWindow && e.data?.type === 'mm-card-response') { window.removeEventListener('message', onMsg); resolve(e.data); } };
        window.addEventListener('message', onMsg);
        frame.contentWindow.postMessage({ type: 'mm-card-request' }, location.origin);
        setTimeout(() => resolve({ ok: false, timeout: true }), 120000); // waits for the OTP step
      });
    }

    function mark(id, bad) { const el = document.getElementById(id); el.classList.toggle('invalid', bad); return !bad; }

    async function placeOrder(e) {
      e.preventDefault();
      const v = id => document.getElementById(id).value.trim();
      let ok = true;
      ok = mark('full-name', !v('full-name')) && ok;
      ok = mark('phone', !/^[6-9]\d{9}$/.test(v('phone'))) && ok;
      ok = mark('address-line1', !v('address-line1')) && ok;
      ok = mark('city', !v('city')) && ok;
      ok = mark('state', !v('state')) && ok;
      ok = mark('pincode', !/^[1-9]\d{5}$/.test(v('pincode'))) && ok;
      const method = document.querySelector('input[name=payment]:checked').value;
      const payment = { method };
      if (method === 'upi') { ok = mark('upi-id', !/^[\w.\-]{2,}@[a-zA-Z]{2,}$/.test(v('upi-id'))) && ok; payment.upiId = v('upi-id'); }
      if (method === 'card') {
        const btn = document.getElementById('place-order');
        btn.disabled = true; btn.textContent = 'Waiting for card and OTP...';
        const card = await cardDetails();
        btn.disabled = false; btn.textContent = 'Place order';
        if (!card.ok) { ok = false; if (card.reason === 'otp') { MM.toast('⚠️ OTP was not verified', 2500, { kind: 'bad' }); return; } } else payment.cardLast4 = card.last4;
      }
      const agreed = document.getElementById('agree-terms').checked;
      document.getElementById('terms-err').style.display = agreed ? 'none' : 'block';
      ok = ok && agreed;
      if (!ok) { MM.toast('⚠️ Please fix the highlighted fields'); return; }

      const btn = document.getElementById('place-order');
      btn.disabled = true; btn.textContent = 'Processing payment...';
      document.getElementById('pay-alert').innerHTML = '';
      const body = {
        items: MM.cartItems(), coupon, deliveryDate: v('delivery-date') || undefined,
        delivery: document.querySelector('input[name=delivery]:checked').value,
        giftWrap: document.getElementById('gift-wrap').checked,
        address: { fullName: v('full-name'), phone: v('phone'), line1: v('address-line1'), line2: v('address-line2'), city: v('city'), state: v('state'), pincode: v('pincode') },
        payment
      };
      const r = await MM.api('/checkout', { method: 'POST', body, auth: true });
      btn.disabled = false; btn.textContent = 'Place order';
      if (r.status === 401) { location.href = 'profile.html?next=checkout.html'; return; }
      if (!r.ok) {
        document.getElementById('pay-alert').innerHTML = `<div class="alert bad" id="payment-error" role="alert"><span class="ico">❌</span><div><b>${r.status === 402 ? 'Payment failed' : 'Could not place order'}</b>${MM.esc(r.data?.message)}${r.data?.gatewayCode ? ` <span class="muted">(code ${MM.esc(r.data.gatewayCode)})</span>` : ''}</div></div>`;
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }
      const o = r.data;
      MM.saveOrder(o);
      MM.saveCart([]);
      sessionStorage.removeItem('mm_coupon');
      root.innerHTML = `${steps(3)}
        <div class="card success" id="order-success">
          <div class="tick">✓</div>
          <h1>Order placed!</h1>
          <p class="muted">Thank you, ${MM.esc(o.address.fullName)}. Your order is confirmed.</p>
          <dl class="kv" style="max-width:380px;margin:20px auto">
            <dt>Order ID</dt><dd id="order-id">${o.id}</dd>
            <dt>Items</dt><dd>${o.itemCount}</dd>
            <dt>Amount paid</dt><dd>${MM.inr(o.totals.total)}</dd>
            <dt>Payment</dt><dd>${o.payment.method.toUpperCase()}${o.payment.cardLast4 ? ' •••• ' + o.payment.cardLast4 : ''}</dd>
            <dt>Arriving by</dt><dd>${new Date(o.estimatedDelivery).toDateString()}</dd>
          </dl>
          <div style="display:flex;gap:10px;justify-content:center"><a class="btn btn-primary" href="orders.html" id="view-orders">View my orders</a><a class="btn btn-ghost" href="index.html">Continue shopping</a></div>
        </div>`;
    }
    init();
  </script>
</body>
</html>

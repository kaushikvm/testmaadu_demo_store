<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile | testmaadu.mart demo store</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <main><div class="container" id="profile-root"></div></main>
  <script src="assets/app.js"></script>
  <script>
    MM.header('profile');
    MM.footer();
    const root = document.getElementById('profile-root');
    const next = new URLSearchParams(location.search).get('next');
    const COUNTRIES = ['India', 'United States', 'United Kingdom', 'Australia', 'Canada', 'Singapore', 'United Arab Emirates', 'Germany'];

    function loginView() {
      root.innerHTML = `
        <div class="login-wrap">
          <div class="card">
            <h1>Welcome back</h1>
            <p class="muted" style="margin-top:0">Sign in to check out and see your orders.</p>
            <div class="demo-accounts" aria-label="Demo accounts">
              <button type="button" id="use-admin" data-email="admin@testmaadu.in" data-pass="Admin@123"><b>🛠️ Admin</b>admin@testmaadu.in<br>Admin@123</button>
              <button type="button" id="use-customer" data-email="customer@testmaadu.in" data-pass="Demo@123"><b>🛍️ Customer</b>customer@testmaadu.in<br>Demo@123</button>
            </div>
            <p class="muted" style="font-size:13px;margin:-6px 0 14px">Admin adds and edits products. Customer shops and pays. Any other email with a 6+ character password signs in as a customer.</p>
            <div id="login-alert"></div>
            <form id="login-form" novalidate>
              <label class="field"><span>Email address</span><input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="username"><div class="err-text">Enter a valid email</div></label>
              <label class="field"><span>Password</span><input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password"><div class="err-text">Password is required</div></label>
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
                <label class="check"><input type="checkbox" id="show-password"> Show password</label>
                <label class="check"><input type="checkbox" id="remember-me" checked> Remember me</label>
              </div>
              <button class="btn btn-primary btn-block btn-lg" id="login-button" type="submit">Sign in</button>
            </form>
            <p class="muted" style="font-size:13px;text-align:center;margin:14px 0 0">New here? Just sign in with any email. <a href="help.html">Need help?</a></p>
          </div>
        </div>`;
      document.querySelectorAll('.demo-accounts button').forEach(b => b.onclick = () => { document.getElementById('email').value = b.dataset.email; document.getElementById('password').value = b.dataset.pass; document.getElementById('login-button').focus(); });
      // Feature flags from the staging server (left over from development; the call fails harmlessly)
      fetch('https://staging-api.testmaadu-mart.test/v1/feature-flags?env=prod').catch(() => {});
      document.getElementById('show-password').onchange = e => document.getElementById('password').type = e.target.checked ? 'text' : 'password';
      document.getElementById('login-form').onsubmit = async e => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const okEmail = /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email);
        document.getElementById('email').classList.toggle('invalid', !okEmail);
        document.getElementById('password').classList.toggle('invalid', !password);
        if (!okEmail || !password) return;
        const btn = document.getElementById('login-button'); btn.disabled = true; btn.textContent = 'Signing in...';
        const r = await MM.api('/auth/login', { method: 'POST', body: { email, password } });
        btn.disabled = false; btn.textContent = 'Sign in';
        if (!r.ok) { document.getElementById('login-alert').innerHTML = `<div class="alert bad" role="alert"><span class="ico">⚠️</span><div><b>Sign in failed</b>${MM.esc(r.data?.message)}</div></div>`; return; }
        MM.setSession(r.data.token, r.data.user);
        location.href = next && /^[a-z-]+\.html$/.test(next) ? next : r.data.user.role === 'admin' ? 'admin.html' : 'index.html';
      };
    }

    async function profileView() {
      const r = await MM.api('/profile', { auth: true });
      if (r.status === 401) { MM.logout(); return; }
      const p = r.ok ? r.data : MM.user();
      MM.write(MM.KEYS.user, p);
      const orders = MM.localOrders().filter(o => o.owner === p.email);
      root.innerHTML = `
        <div class="page-head"><div><h1>My profile ${p.role === 'admin' ? '<span class="role-pill">Admin</span>' : ''}</h1><p>Manage your details and preferences.</p></div><button class="btn btn-ghost" id="logout-button" type="button">Sign out</button></div>
        <div class="split">
          <div class="card">
            <div class="tabs" role="tablist">
              <button class="on" type="button" data-tab="details" role="tab">Personal details</button>
              <button type="button" data-tab="prefs" role="tab">Preferences</button>
            </div>
            <div id="save-alert"></div>
            <form id="profile-form" novalidate>
              <div data-panel="details">
                <div class="row">
                  <label class="field"><span>Full name</span><input type="text" id="profile-name" name="name" value="${MM.esc(p.name)}"><div class="err-text">Name cannot be empty</div></label>
                  <label class="field"><span>Email</span><input type="email" id="profile-email" value="${MM.esc(p.email)}" readonly style="background:var(--surface-2)"></label>
                </div>
                <div class="row">
                  <label class="field"><span>Mobile number</span><input type="tel" id="profile-phone" name="phone" value="${MM.esc(p.phone)}" placeholder="98xxxxxxxx"><div class="err-text">7 to 15 digits</div></label>
                  <label class="field"><span>Country</span><select id="profile-country" name="country">${COUNTRIES.map(c => `<option ${c === p.country ? 'selected' : ''}>${c}</option>`).join('')}</select></label>
                </div>
                <label class="field"><span>Gender</span></label>
                <div style="display:flex;gap:20px;margin:-8px 0 14px" role="radiogroup" aria-label="Gender">
                  ${['Male', 'Female', 'Prefer not to say'].map(g => `<label class="radio"><input type="radio" name="gender" value="${g}" ${p.gender === g ? 'checked' : ''}> ${g}</label>`).join('')}
                </div>
              </div>
              <div data-panel="prefs" hidden>
                <label class="field"><span>Preferred delivery slot</span></label>
                <div style="display:grid;gap:2px;margin:-8px 0 14px" role="radiogroup" aria-label="Delivery slot">
                  ${[['anytime', 'Any time'], ['morning', 'Morning (9 am to 12 pm)'], ['evening', 'Evening (5 pm to 9 pm)']].map(([v, l]) => `<label class="radio"><input type="radio" name="deliverySlot" value="${v}" ${p.deliverySlot === v ? 'checked' : ''}> ${l}</label>`).join('')}
                </div>
                <label class="field"><span>Email me about</span></label>
                <div style="display:grid;gap:2px;margin:-8px 0 14px">
                  <label class="check"><input type="checkbox" name="orderUpdates" ${p.notifications?.orderUpdates ? 'checked' : ''}> Order updates</label>
                  <label class="check"><input type="checkbox" name="offers" ${p.notifications?.offers ? 'checked' : ''}> Offers and coupons</label>
                  <label class="check"><input type="checkbox" name="newsletter" ${p.notifications?.newsletter ? 'checked' : ''}> Monthly newsletter</label>
                </div>
              </div>
              <button class="btn btn-primary" id="save-profile" type="submit">Save changes</button>
            </form>
          </div>
          <aside class="card sticky">
            <div class="profile-card"><span class="avatar">${MM.esc((p.name || p.email)[0].toUpperCase())}</span><div><h2 style="margin:0">${MM.esc(p.name)}</h2><div class="muted">${MM.esc(p.email)}</div></div></div>
            <div class="divider"></div>
            <div class="summary">
              <div class="line"><span>Orders placed</span><b>${orders.length}</b></div>
              <div class="line"><span>Items in cart</span><b>${MM.cartCount()}</b></div>
              <div class="line"><span>Wishlist</span><b>${MM.wishlist().length}</b></div>
            </div>
            <a class="btn btn-ghost btn-block" href="orders.html" style="margin-top:12px">📦 Go to my orders</a>
            <a class="btn btn-ghost btn-block" href="account.html" style="margin-top:8px">👤 My account</a>
          </aside>
        </div>`;
      document.getElementById('logout-button').onclick = MM.logout;
      document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
        document.querySelectorAll('[data-tab]').forEach(x => x.classList.toggle('on', x === b));
        document.querySelectorAll('[data-panel]').forEach(x => x.hidden = x.dataset.panel !== b.dataset.tab);
      });
      document.getElementById('profile-form').onsubmit = async e => {
        e.preventDefault();
        const f = e.target;
        const body = {
          name: f.name.value.trim(), phone: f.phone.value.trim(), country: f.country.value,
          gender: f.querySelector('input[name=gender]:checked')?.value,
          deliverySlot: f.querySelector('input[name=deliverySlot]:checked')?.value,
          notifications: { orderUpdates: f.orderUpdates.checked, offers: f.offers.checked, newsletter: f.newsletter.checked }
        };
        const r = await MM.api('/profile', { method: 'PUT', body, auth: true });
        // DEMO BUG: a 400 from the API (for example phone "+91 98765 43210") still shows "Profile saved".
        document.getElementById('save-alert').innerHTML = r.ok || r.status === 400
          ? `<div class="alert ok" role="status"><span class="ico">✅</span><div><b>Profile saved</b>Your changes have been updated.</div></div>`
          : `<div class="alert bad" role="alert"><span class="ico">⚠️</span><div><b>Could not save</b>${MM.esc(r.data?.message)}</div></div>`;
        if (r.ok) MM.write(MM.KEYS.user, r.data);
      };
    }

    MM.loggedIn() ? profileView() : loginView();
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Market | OnlineMart demo store</title>
  <meta name="description" content="OnlineMart is a demo ecommerce store for practising functional, E2E and API testing. Created by TestMaadu.in">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <main>
    <div class="container">
      <section class="hero">
        <span class="chip" style="background:rgba(255,255,255,.18);color:#fff;margin-bottom:12px">🔥 Festive sale is live</span>
        <h1>Everything you need, at prices you will love.</h1>
        <p>Browse 14 hand-picked products, add a few to your cart and check out in under a minute.</p>
        <span class="coupon">Extra 10% off with <code>TESTMAADU10</code></span>
        <div class="hero-art" aria-hidden="true">🎧👟☕</div>
      </section>

      <div class="market">
        <aside class="card filters" aria-label="Filters">
          <h3>Category</h3>
          <label class="field" style="margin:0"><span class="sr">Category</span>
            <select id="category" name="category" data-testid="category-filter">
              <option value="All">All categories</option>
            </select>
          </label>

          <h3>Refine</h3>
          <label class="check"><input type="checkbox" id="in-stock" name="inStock"> In stock only</label>
          <label class="check"><input type="checkbox" id="free-delivery" name="freeDelivery"> Free delivery</label>
          <label class="check"><input type="checkbox" id="top-rated" name="topRated"> 4★ and above</label>

          <h3>Sort by</h3>
          <div role="radiogroup" aria-label="Sort by">
            <label class="radio"><input type="radio" name="sort" value="popular" checked> Popularity</label>
            <label class="radio"><input type="radio" name="sort" value="price-asc"> Price: low to high</label>
            <label class="radio"><input type="radio" name="sort" value="price-desc"> Price: high to low</label>
            <label class="radio"><input type="radio" name="sort" value="rating"> Customer rating</label>
          </div>
          <div class="divider"></div>
          <button class="btn btn-ghost btn-block" id="clear-filters" type="button">Clear filters</button>
        </aside>

        <section>
          <div class="toolbar">
            <div class="searchbox"><input type="search" id="search" name="q" placeholder="Search for headphones, books, shoes..." aria-label="Search products" autocomplete="off"></div>
          </div>
          <div class="result-count" id="result-count">Loading products...</div>
          <div class="grid" id="product-grid">
            <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script src="assets/app.js"></script>
  <script>
    MM.header('market');
    MM.footer();
    const params = new URLSearchParams(location.search);
    const el = id => document.getElementById(id);
    let timer;

    (async () => {
      const r = await MM.api('/categories');
      if (r.ok) el('category').insertAdjacentHTML('beforeend', r.data.map(c => `<option value="${c}">${c}</option>`).join(''));
      if (params.get('category')) el('category').value = params.get('category');
      load();
    })();

    async function load() {
      const q = new URLSearchParams();
      if (el('search').value.trim()) q.set('q', el('search').value.trim());
      if (el('category').value !== 'All') q.set('category', el('category').value);
      if (el('in-stock').checked) q.set('inStock', 'true');
      if (el('free-delivery').checked) q.set('freeDelivery', 'true');
      if (el('top-rated').checked) q.set('minRating', '4');
      q.set('sort', document.querySelector('input[name=sort]:checked').value);
      const r = await MM.api('/products?' + q.toString());
      if (!r.ok) { el('product-grid').innerHTML = `<div class="alert bad"><span class="ico">⚠️</span><div><b>Could not load products</b>${MM.esc(r.data?.message)}</div></div>`; return; }
      const items = r.data.items;
      el('result-count').textContent = `Showing ${items.length} of 14 products`;
      if (!items.length) { el('product-grid').innerHTML = `<div class="card empty" style="grid-column:1/-1"><div class="big">🔎</div><h2>No products match</h2><p class="muted">Try a different search or clear the filters.</p></div>`; return; }
      const wish = MM.wishlist();
      el('product-grid').innerHTML = items.map(p => `
        <article class="product" data-product-id="${p.id}">
          <div class="thumb" style="${MM.thumbBg(p.colors)}">
            ${p.stock === 0 ? '<span class="chip bad tag">Out of stock</span>' : p.stock < 10 ? `<span class="chip accent tag">Only ${p.stock} left</span>` : p.freeDelivery ? '<span class="chip ok tag">Free delivery</span>' : ''}
            <button class="wish" type="button" title="Add to wishlist" aria-label="Wishlist ${MM.esc(p.name)}" data-wish="${p.id}">${wish.includes(p.id) ? '❤️' : '🤍'}</button>
            <span aria-hidden="true">${p.emoji}</span>
          </div>
          <div class="body">
            <span class="cat">${p.category}</span>
            <a class="name" href="product.html?id=${p.id}">${MM.esc(p.name)}</a>
            <div>${MM.stars(p.rating)} <span class="rating">(${p.reviews.toLocaleString('en-IN')})</span></div>
            <div class="price"><span class="now">${MM.inr(p.price)}</span><span class="mrp">${MM.inr(p.mrp)}</span><span class="off">${MM.pct(p)}% off</span></div>
            <div class="actions">
              <button class="btn btn-primary add-to-cart" type="button" data-add="${p.id}" ${p.stock === 0 ? 'disabled' : ''}>${p.stock === 0 ? 'Sold out' : 'Add to cart'}</button>
            </div>
          </div>
        </article>`).join('');
      window._products = items;
    }

    el('product-grid').addEventListener('click', e => {
      const add = e.target.closest('[data-add]');
      if (add) { const p = window._products.find(x => x.id === add.dataset.add); MM.addToCart(p); add.textContent = 'Added ✓'; setTimeout(() => add.textContent = 'Add to cart', 1200); }
      const w = e.target.closest('[data-wish]');
      if (w) { const on = MM.toggleWish(w.dataset.wish); w.textContent = on ? '❤️' : '🤍'; MM.toast(on ? 'Saved to wishlist' : 'Removed from wishlist', 1600); }
    });
    el('search').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(load, 300); });
    ['category', 'in-stock', 'free-delivery', 'top-rated'].forEach(id => el(id).addEventListener('change', load));
    document.querySelectorAll('input[name=sort]').forEach(r => r.addEventListener('change', load));
    el('clear-filters').addEventListener('click', () => {
      el('search').value = ''; el('category').value = 'All';
      ['in-stock', 'free-delivery', 'top-rated'].forEach(id => el(id).checked = false);
      document.querySelector('input[name=sort][value=popular]').checked = true;
      load();
    });
  </script>
</body>
</html>

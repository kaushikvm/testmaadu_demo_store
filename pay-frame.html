<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <title>MaaduPay secure card form</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <style>
    body { background: transparent; min-height: 0; display: block; }
    .pay { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
    .brand { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 12px; color: var(--muted); font-weight: 600; }
    .brand b { color: var(--brand); font-size: 14px; }
    label.field { margin-bottom: 10px; }
    .cards { letter-spacing: 2px; }
    .row3 { grid-template-columns: 1fr 1fr 1fr; }
    @media (max-width: 420px) { .row3 { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <form class="pay" id="card-form" novalidate autocomplete="off">
    <div class="brand"><b>🔒 MaaduPay</b><span>Secure card form (iframe)</span></div>
    <label class="field"><span>Card number</span>
      <input type="text" id="card-number" name="cardNumber" inputmode="numeric" placeholder="4111 1111 1111 1111" maxlength="19" class="cards">
      <div class="err-text">Enter a 16 digit card number</div>
    </label>
    <label class="field"><span>Name on card</span>
      <input type="text" id="card-name" name="cardName" placeholder="As printed on the card">
      <div class="err-text">Enter the name on the card</div>
    </label>
    <div class="row3">
      <label class="field"><span>Month</span>
        <select id="exp-month" name="expMonth"><option value="">MM</option>
          <option>01</option><option>02</option><option>03</option><option>04</option><option>05</option><option>06</option><option>07</option><option>08</option><option>09</option><option>10</option><option>11</option><option>12</option>
        </select><div class="err-text">Pick a month</div></label>
      <label class="field"><span>Year</span>
        <select id="exp-year" name="expYear"><option value="">YYYY</option></select><div class="err-text">Pick a year</div></label>
      <label class="field"><span>CVV</span>
        <input type="password" id="card-cvv" name="cvv" inputmode="numeric" placeholder="•••" maxlength="3"><div class="err-text">3 digits</div></label>
    </div>
  </form>
  <div id="otp-step" hidden>
    <iframe id="otp-iframe" name="otp-iframe" title="3-D Secure OTP verification" style="width:100%;height:230px;border:0;margin-top:10px"></iframe>
  </div>
  <script>
    const y = new Date().getFullYear();
    const yearSel = document.getElementById('exp-year');
    for (let i = 0; i < 10; i++) yearSel.insertAdjacentHTML('beforeend', `<option>${y + i}</option>`);
    const num = document.getElementById('card-number');
    num.addEventListener('input', () => { num.value = num.value.replace(/\D/g, '').slice(0, 16).replace(/(.{4})(?=.)/g, '$1 '); });

    function validate() {
      const checks = [
        ['card-number', v => /^\d{16}$/.test(v.replace(/\s/g, ''))],
        ['card-name', v => v.trim().length >= 2],
        ['exp-month', v => !!v],
        ['exp-year', v => !!v],
        ['card-cvv', v => /^\d{3}$/.test(v)]
      ];
      let ok = true;
      for (const [id, fn] of checks) { const el = document.getElementById(id); const good = fn(el.value); el.classList.toggle('invalid', !good); ok = ok && good; }
      return ok;
    }
    // After the card details pass, a 3-D Secure OTP page opens in an iframe inside this iframe (OTP 123456).
    let pending = null;
    window.addEventListener('message', e => {
      if (e.origin !== location.origin || !e.data) return;
      if (e.data.type === 'mm-card-request') {
        const ok = validate();
        const digits = num.value.replace(/\s/g, '');
        if (!ok) { e.source.postMessage({ type: 'mm-card-response', ok: false }, e.origin); return; }
        pending = { source: e.source, last4: digits.slice(-4), name: document.getElementById('card-name').value.trim() };
        document.getElementById('otp-step').hidden = false;
        document.getElementById('otp-iframe').src = 'otp-frame.html?last4=' + pending.last4 + '&t=' + Date.now();
        parent.postMessage({ type: 'mm-frame-size', height: document.body.scrollHeight }, location.origin);
      }
      if ((e.data.type === 'mm-otp-verified' || e.data.type === 'mm-otp-cancelled') && pending) {
        const ok = e.data.type === 'mm-otp-verified';
        pending.source.postMessage({ type: 'mm-card-response', ok, reason: ok ? null : 'otp', last4: ok ? pending.last4 : null, name: pending.name }, location.origin);
        pending = null;
        document.getElementById('otp-step').hidden = true;
        document.getElementById('otp-iframe').src = 'about:blank';
        parent.postMessage({ type: 'mm-frame-size', height: document.body.scrollHeight }, location.origin);
      }
    });
  </script>
</body>
</html>
